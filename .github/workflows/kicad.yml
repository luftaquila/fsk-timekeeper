name: Build PCB

on:
  push:
    branches:
      - '**'
    paths:
      - 'device/hardware/**'
      - '.github/assets/pcb-assembly.svg'
      - '.github/actions/kicad-cli/**'
      - '.github/workflows/kicad.yml'
  workflow_call:
  workflow_dispatch:

jobs:
  build-pcb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/kicad-cli

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick
          convert -version

      # --exit-code-violations annotates violations; continue-on-error keeps them from blocking
      # the artifact. Known ERC items are excluded in the project file (erc.erc_exclusions).
      - name: Schematic ERC
        continue-on-error: true
        run: |
          cd device/hardware
          kicad-cli --version
          kicad-cli sch erc -o fsk-timekeeper-erc.rpt --severity-error --severity-warning --exit-code-violations fsk-timekeeper.kicad_sch

      - name: PCB DRC
        continue-on-error: true
        run: |
          cd device/hardware
          kicad-cli pcb drc -o fsk-timekeeper-drc.rpt --schematic-parity --refill-zones --severity-error --exit-code-violations fsk-timekeeper.kicad_pcb

      - name: Show ERC / DRC reports
        run: |
          echo "##### ERC REPORT #####"
          cat device/hardware/fsk-timekeeper-erc.rpt
          echo "##### DRC REPORT #####"
          cat device/hardware/fsk-timekeeper-drc.rpt
          mkdir -p kicad
          mv device/hardware/fsk-timekeeper-erc.rpt device/hardware/fsk-timekeeper-drc.rpt kicad/

      - name: Build PCB schematic, artwork and STEP model
        run: |
          npm i -g svgexport
          kicad-cli sch export svg device/hardware/fsk-timekeeper.kicad_sch -o kicad --exclude-drawing-sheet --no-background-color
          kicad-cli pcb export svg device/hardware/fsk-timekeeper.kicad_pcb -o kicad/fsk-timekeeper-artwork.svg --layers "B.Cu,F.Cu,F.Silkscreen,B.Silkscreen,User.Drawings,Edge.Cuts" --exclude-drawing-sheet
          svgexport kicad/fsk-timekeeper.svg kicad/fsk-timekeeper-schematic.png 8000: "svg{background:white;}"
          convert kicad/fsk-timekeeper-schematic.png -trim -bordercolor white -border 100x100 kicad/fsk-timekeeper-schematic.png
          svgexport kicad/fsk-timekeeper-artwork.svg kicad/fsk-timekeeper-artwork.png 8000:
          convert kicad/fsk-timekeeper-artwork.png -trim -bordercolor transparent -border 100x100 kicad/fsk-timekeeper-artwork.png
          kicad-cli pcb export step -o kicad/fsk-timekeeper-3d.stp --include-tracks device/hardware/fsk-timekeeper.kicad_pcb

      - name: Copy production files and assembly diagram
        run: |
          cp device/hardware/jlcpcb/production_files/BOM-fsk-timekeeper.csv \
            device/hardware/jlcpcb/production_files/CPL-fsk-timekeeper.csv \
            device/hardware/jlcpcb/production_files/GERBER-fsk-timekeeper.zip \
            kicad/
          cp .github/assets/pcb-assembly.svg kicad/fsk-timekeeper-pcb.svg

      - uses: actions/upload-artifact@v7
        with:
          name: fsk-timekeeper-pcb
          path: |
            kicad/BOM-fsk-timekeeper.csv
            kicad/CPL-fsk-timekeeper.csv
            kicad/GERBER-fsk-timekeeper.zip
            kicad/fsk-timekeeper-schematic.png
            kicad/fsk-timekeeper-artwork.png
            kicad/fsk-timekeeper-3d.stp
            kicad/fsk-timekeeper-pcb.svg
          if-no-files-found: error
