# Deploy a published release, or build the selected ref for a manual console update.
name: Build web application

on:
  workflow_call:
    inputs:
      release-tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release-tag:
        description: Published release tag (leave empty to build the selected ref)
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-web:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout console
        if: inputs.release-tag == ''
        uses: actions/checkout@v6
      - name: Setup Node
        if: inputs.release-tag == ''
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Build and test console
        if: inputs.release-tag == ''
        working-directory: console
        run: |
          npm ci
          npm test
          npm run build
          printf '%s\n' "$GITHUB_SHA" > dist/build-sha.txt
          mv dist ../site
      - name: Download and verify the published release
        if: inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid release tag" >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --json isDraft,publishedAt,assets > release.json
          jq -e '.isDraft == false and .publishedAt != null and
            ([.assets[].name] | contains(["fsk-timekeeper-firmware.zip", "fsk-timekeeper-console.html", "fsk-timekeeper-web.zip"]))' release.json
          gh release download "$RELEASE_TAG" --pattern fsk-timekeeper-web.zip
          mkdir site
          unzip -q fsk-timekeeper-web.zip -d site
          tag_sha="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
          test "$(cat site/build-sha.txt)" = "$tag_sha"
          test -s site/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
