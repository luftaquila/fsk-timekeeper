name: Release

on:
  push:
    tags:
      - v*

# Called workflows get at most these (Pages: pages/id-token; release: contents: write; camera
# image: packages: write).
permissions:
  contents: write
  pages: write
  id-token: write
  packages: write

jobs:
  build-firmware:
    uses: ./.github/workflows/firmware.yml
  build-pcb:
    uses: ./.github/workflows/kicad.yml
  build-3d:
    uses: ./.github/workflows/3d.yml
  build-html:
    uses: ./.github/workflows/web-bundle.yml
  build-camera:
    uses: ./.github/workflows/camera.yml
  # Publish the matching firmware and console before updating the hosted console.
  deploy-web:
    needs: [release]
    uses: ./.github/workflows/web.yml
  release:
    name: release
    runs-on: ubuntu-24.04
    needs: [build-firmware, build-pcb, build-3d, build-html, build-camera]
    steps:
      - uses: actions/download-artifact@v8
      - run: |
          zip -r fsk-timekeeper-firmware.zip fsk-timekeeper-firmware
          zip -r fsk-timekeeper-pcb.zip fsk-timekeeper-pcb
          zip -r fsk-timekeeper-3d.zip fsk-timekeeper-3d
          mv html/fsk-timekeeper-console.html .
          mv photofinish-installer/* .
      - uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: |
            fsk-timekeeper-3d.zip
            fsk-timekeeper-firmware.zip
            fsk-timekeeper-pcb.zip
            fsk-timekeeper-console.html
            install-photofinish.sh
            fsk-timekeeper-photofinish.tar.gz
          commit: ${{ github.sha }}
          tag: ${{ github.ref_name }}
          body: |
            ### Console

            * Open the [web console](https://luftaquila.github.io/fsk-timekeeper/) in a browser with Web Serial support.
              * For offline use, open `fsk-timekeeper-console.html`.

            ### Firmware

            1. In `Settings` → `Firmware Upgrade`, choose `fsk-timekeeper-firmware.zip` and start the upgrade.
            2. Click `Select Bootloader` if asked. A new or unresponsive board may need a double-tap on `RST`.
            3. Click `Reconnect` and select the board to check its version.

            Upgrade every board with this release and use this release's console.

            ### Photo finish camera

            * Install on the camera's Raspberry Pi: `curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install-photofinish.sh | sudo bash`
            * Update it: `sudo fsk-timekeeper-update ${{ github.ref_name }}`
