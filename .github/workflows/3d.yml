name: Export 3d models

on:
  push:
    branches:
      - '**'
    paths:
      - 'device/3d/**'
      - 'device/hardware/**'
      - '.github/actions/kicad-cli/**'
      - '.github/workflows/3d.yml'
  workflow_call:
  workflow_dispatch:

jobs:
  build-3d:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/kicad-cli

      # Nightly image: its Manifold backend renders the minkowski() housings in seconds, where
      # apt's 2021.01 release (CGAL only) takes minutes. Bump the dated tag occasionally.
      # apt fallback (no Docker):
      #   sudo apt-get install -y openscad
      #   openscad -o master.stl -D 'part="both"' master.scad   # no --backend flag
      - name: Render STL files from OpenSCAD sources
        run: |
          docker run --rm --entrypoint sh \
            -v "$PWD/device/3d:/work" -w /work \
            openscad/openscad:dev.2026-09-23 -ec '
              for v in master sensor; do
                openscad --backend=manifold -o "$v.stl" -D "part=\"both\"" "$v.scad"
              done
              openscad --backend=manifold -o photofinish.stl -D "part=\"both\"" -D "photofinish=true" master.scad
              openscad --backend=manifold -o sensor-holder.stl sensor-holder.scad'
          ls -la device/3d/master.stl device/3d/photofinish.stl device/3d/sensor.stl device/3d/sensor-holder.stl

      - name: Export PCB STEP model
        run: |
          kicad-cli pcb export step -o device/3d/fsk-timekeeper-pcb.stp --include-tracks device/hardware/fsk-timekeeper.kicad_pcb

      - uses: actions/upload-artifact@v7
        with:
          name: fsk-timekeeper-3d
          path: |
            device/3d/master.stl
            device/3d/photofinish.stl
            device/3d/sensor.stl
            device/3d/sensor-holder.stl
            device/3d/fsk-timekeeper-pcb.stp
          if-no-files-found: error
